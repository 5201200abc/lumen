appId: dev.mfordjody.lumen
productName: Lumen
copyright: Copyright © 2026
asar: true
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
  - package.json
  - node_modules/**/*
  - "!node_modules/.cache/**/*"
  - "!**/{README,readme,CHANGELOG,changelog}*"
  - "!**/{test,tests,__tests__,powered-test,example,examples}/**"
  - "!**/*.{map,md,ts,tsx}"
extraResources:
  - from: node_modules/sql.js/dist/sql-wasm.wasm
    to: sql-wasm.wasm
  - from: resources/runtime
    to: runtime
  - from: resources/chrome-extension
    to: chrome-extension
mac:
  category: public.app-category.productivity
  icon: resources/icon.icns
  target:
    - dmg
    - zip
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  darkModeSupport: true
  artifactName: "${productName}-${version}-mac-${arch}.${ext}"
dmg:
  artifactName: "${productName}-${version}-mac-${arch}.dmg"
  title: Lumen
win:
  icon: resources/icon.png
  target:
    - nsis
    - portable
    - zip
  artifactName: "${productName}-${version}-windows-${arch}.${ext}"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Lumen
  artifactName: "${productName}-Setup-${version}-${arch}.exe"
portable:
  artifactName: "${productName}-Portable-${version}-${arch}.exe"
linux:
  category: Utility
  icon: resources/icon.png
  target:
    - AppImage
    - deb
    - rpm
    - tar.gz
  artifactName: "${productName}-${version}-linux-${arch}.${ext}"
