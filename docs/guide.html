<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumen · Usage</title>
  <meta name="description" content="Step-by-step guide for installing and using Lumen." />
  <link rel="icon" type="image/png" href="icon.png" />
  <style>
    @font-face {
      font-family: "Lumen CJK";
      src: url("fonts/LXGWWenKaiLite-Light.ttf") format("truetype");
      unicode-range: U+3000-303F, U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF, U+FF00-FFEF;
      font-style: normal;
      font-weight: 300;
      font-display: swap;
    }
    @font-face {
      font-family: "Maple Mono";
      src: url("fonts/MapleMono-Light.ttf.woff2") format("woff2");
      font-style: normal;
      font-weight: 300;
      font-display: swap;
    }
    :root {
      color-scheme: dark light;
      --bg: #09090b;
      --fg: #f4f4f0;
      --fg-subtle: #9a9a92;
      --fg-faint: #52524c;
      --line: rgba(255, 255, 255, 0.08);
      --glass: rgba(18, 18, 22, 0.72);
      --glass-border: rgba(255, 255, 255, 0.1);
      --glass-border-hover: rgba(255, 255, 255, 0.28);
      --glass-hover: rgba(255, 255, 255, 0.08);
      --accent-copper: #e59a68;
      --font-body: "Lumen CJK", "Maple Mono", sans-serif;
      --font-mono: "Maple Mono", monospace;
      --sidebar: 248px;
      --outline: 228px;
    }
    [data-theme="light"] {
      color-scheme: light;
      --bg: #f7f6f2;
      --fg: #151513;
      --fg-subtle: #6b6a63;
      --fg-faint: #b2b1a8;
      --line: rgba(20, 20, 18, 0.08);
      --glass: rgba(255, 255, 255, 0.78);
      --glass-border: rgba(20, 20, 18, 0.1);
      --glass-border-hover: rgba(20, 20, 18, 0.28);
      --glass-hover: rgba(0, 0, 0, 0.05);
      --accent-copper: #b85d19;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; scroll-padding-top: 28px; }
    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
    }
    .shell {
      display: grid;
      grid-template-columns: var(--sidebar) minmax(0, 1fr) var(--outline);
      min-height: 100vh;
    }
    .sidebar,
    .outline {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--glass-border) transparent;
    }
    .sidebar {
      border-right: 1px solid var(--line);
      padding: 28px 18px 32px 28px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--fg);
    }
    .brand img {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: none;
    }
    .brand span {
      font-size: 16px;
      letter-spacing: -0.6px;
      font-weight: 500;
    }
    .nav-label {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent-copper);
      margin-bottom: 8px;
    }
    .nav a {
      display: block;
      position: relative;
      color: var(--fg-subtle);
      text-decoration: none;
      font-size: 13.5px;
      line-height: 1.3;
      padding: 7px 10px 7px 12px;
      border-radius: 8px;
      border-left: 2px solid transparent;
    }
    .nav a:hover { color: var(--fg); background: var(--glass-hover); }
    .nav a.active {
      color: var(--fg);
      border-left-color: var(--accent-copper);
      background: var(--glass-hover);
    }
    .sidebar-foot {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 12px;
    }
    .sidebar-foot a {
      color: var(--fg-faint);
      text-decoration: none;
    }
    .sidebar-foot a:hover { color: var(--fg); }
    .content {
      min-width: 0;
      padding: 48px 48px 96px;
    }
    .article {
      max-width: 680px;
      margin: 0 auto;
    }
    h1 {
      font-size: clamp(32px, 4.4vw, 44px);
      font-weight: 500;
      letter-spacing: -1.6px;
      line-height: 1.05;
      margin-bottom: 10px;
    }
    .lede {
      color: var(--fg-subtle);
      font-size: 15.5px;
      line-height: 1.5;
      margin-bottom: 48px;
    }
    .article section {
      margin-bottom: 52px;
    }
    h2 {
      font-size: 22px;
      font-weight: 500;
      letter-spacing: -0.6px;
      margin: 0 0 18px;
      padding-top: 8px;
      scroll-margin-top: 28px;
    }
    h3 {
      font-size: 14.5px;
      font-weight: 500;
      color: var(--accent-copper);
      margin: 22px 0 8px;
      letter-spacing: -0.1px;
      scroll-margin-top: 28px;
    }
    p, li {
      font-size: 15px;
      line-height: 1.65;
      color: var(--fg);
    }
    p { margin-bottom: 10px; color: var(--fg-subtle); }
    ol, ul { padding-left: 1.15rem; margin-bottom: 6px; }
    li { margin: 0 0 7px; color: var(--fg-subtle); }
    code, kbd {
      font-family: var(--font-mono);
      font-size: 0.9em;
      background: var(--glass-hover);
      border: 1px solid var(--glass-border);
      border-radius: 6px;
      padding: 0 5px;
      color: var(--fg);
    }
    pre {
      font-family: var(--font-mono);
      font-size: 12.5px;
      line-height: 1.5;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 14px 16px;
      overflow-x: auto;
      margin: 10px 0 4px;
    }
    a { color: var(--accent-copper); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .outline {
      border-left: 1px solid var(--line);
      padding: 88px 22px 32px 18px;
    }
    .outline-title {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent-copper);
      margin-bottom: 12px;
    }
    .outline nav a {
      display: block;
      color: var(--fg-faint);
      text-decoration: none;
      font-size: 12.5px;
      line-height: 1.35;
      padding: 5px 0 5px 10px;
      border-left: 1px solid var(--line);
    }
    .outline nav a.level-3 { padding-left: 22px; font-size: 12px; }
    .outline nav a:hover { color: var(--fg); }
    .outline nav a.active {
      color: var(--fg);
      border-left-color: var(--accent-copper);
    }
    .top-controls {
      position: fixed;
      top: 22px;
      right: 18px;
      z-index: 50;
      display: flex;
      gap: 8px;
    }
    .menu-btn { display: none; }
    .btn-circle-control {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--glass-border);
      background: var(--glass);
      color: var(--fg);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      backdrop-filter: blur(28px);
    }
    .btn-circle-control:hover { border-color: var(--glass-border-hover); }
    .backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 30;
    }
    @media (max-width: 1080px) {
      .shell { grid-template-columns: var(--sidebar) minmax(0, 1fr); }
      .outline { display: none; }
      .top-controls { right: 16px; }
    }
    @media (max-width: 820px) {
      .shell { grid-template-columns: 1fr; }
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 40;
        width: min(280px, 86vw);
        background: var(--bg);
        transform: translateX(-105%);
        transition: transform 0.22s ease;
      }
      html.nav-open .sidebar { transform: none; }
      html.nav-open .backdrop { display: block; }
      .menu-btn { display: flex; }
      .content { padding: 72px 20px 80px; }
    }
  </style>
</head>
<body>
  <div class="backdrop" id="backdrop"></div>
  <div class="top-controls">
    <button type="button" class="btn-circle-control menu-btn" id="menuBtn" title="Menu">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
        <line x1="4" y1="7" x2="20" y2="7" /><line x1="4" y1="12" x2="20" y2="12" /><line x1="4" y1="17" x2="20" y2="17" />
      </svg>
    </button>
    <button type="button" id="langToggleBtn" class="btn-circle-control" title="Switch Language / 切换语言 (ZH / EN)">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="2" y1="12" x2="22" y2="12"></line>
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
      </svg>
    </button>
    <button type="button" id="themeToggleBtn" class="btn-circle-control" title="Toggle Light/Dark / 切换光影">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
    </button>
  </div>

  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="./">
        <img src="icon.png" alt="" />
        <span>Lumen</span>
      </a>
      <nav class="nav" id="sidebarNav">
        <div class="nav-label" id="navLabel">Guide</div>
      </nav>
      <div class="sidebar-foot">
        <a href="privacy.html">Privacy</a>
        <a href="terms.html">Terms</a>
        <a href="https://github.com/5201200abc/lumen">GitHub</a>
      </div>
    </aside>

    <main class="content">
      <article class="article" id="article"></article>
    </main>

    <aside class="outline">
      <div class="outline-title" id="outlineTitle">On this page</div>
      <nav id="outlineNav"></nav>
    </aside>
  </div>

  <script>
    const UI = {
      en: { titlePage: "Lumen · Usage", navLabel: "Guide", onPage: "On this page" },
      zh: { titlePage: "Lumen · 使用文档", navLabel: "文档", onPage: "本页层级" }
    };

    let currentLang = localStorage.getItem("lumen_lang") || "en";

    function slug(text, used) {
      const base = text
        .toLowerCase()
        .replace(/<[^>]+>/g, "")
        .replace(/[^\p{L}\p{N}]+/gu, "-")
        .replace(/^-+|-+$/g, "") || "section";
      let id = base;
      let n = 2;
      while (used.has(id)) id = `${base}-${n++}`;
      used.add(id);
      return id;
    }

    function escapeHtml(text) {
      return text.replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
    }

    function inline(text) {
      return escapeHtml(text)
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>')
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    }

    const LIST_ITEM = /^(\s*)([-*+]|\d+\.)\s+(.*)$/;

    function isFence(line) {
      return line.trim().startsWith("```");
    }

    function isHeading(line) {
      return /^#{1,3}\s+\S/.test(line);
    }

    function renderMarkdown(md) {
      const used = new Set();
      const lines = md.replace(/\r\n/g, "\n").split("\n");
      const html = [];
      let i = 0;
      let sawH1 = false;
      let firstP = true;
      while (i < lines.length) {
        const line = lines[i];
        if (isFence(line)) {
          const fence = [];
          i += 1;
          while (i < lines.length && !isFence(lines[i])) {
            fence.push(lines[i]);
            i += 1;
          }
          if (i < lines.length) i += 1;
          html.push(`<pre><code>${escapeHtml(fence.join("\n"))}</code></pre>`);
          continue;
        }
        const heading = /^(#{1,3})\s+(.+)$/.exec(line);
        if (heading) {
          const depth = heading[1].length;
          const text = heading[2].trim();
          const id = slug(text, used);
          if (depth === 1) sawH1 = true;
          html.push(`<h${depth} id="${id}">${inline(text)}</h${depth}>`);
          i += 1;
          continue;
        }
        if (!line.trim()) {
          i += 1;
          continue;
        }
        const list = LIST_ITEM.exec(line);
        if (list) {
          const ordered = /^\d+\./.test(list[2]);
          const items = [];
          while (i < lines.length) {
            const item = LIST_ITEM.exec(lines[i]);
            if (!item) break;
            items.push(item[3]);
            i += 1;
          }
          const tag = ordered ? "ol" : "ul";
          html.push(`<${tag}>${items.map((item) => `<li>${inline(item)}</li>`).join("")}</${tag}>`);
          firstP = false;
          continue;
        }
        const para = [line];
        i += 1;
        while (
          i < lines.length &&
          lines[i].trim() &&
          !isHeading(lines[i]) &&
          !isFence(lines[i]) &&
          !LIST_ITEM.test(lines[i])
        ) {
          para.push(lines[i]);
          i += 1;
        }
        const cls = sawH1 && firstP ? ' class="lede"' : "";
        firstP = false;
        html.push(`<p${cls}>${inline(para.join(" "))}</p>`);
      }
      return html.join("\n");
    }

    function applyTheme(mode) {
      document.documentElement.setAttribute("data-theme", mode);
      localStorage.setItem("lumen_user_theme", mode);
    }

    function applyChrome() {
      const t = UI[currentLang];
      document.title = t.titlePage;
      document.documentElement.lang = currentLang === "zh" ? "zh-CN" : "en";
      document.getElementById("navLabel").textContent = t.navLabel;
      document.getElementById("outlineTitle").textContent = t.onPage;
    }

    function buildNav() {
      const sidebar = document.getElementById("sidebarNav");
      sidebar.querySelectorAll("a").forEach((el) => el.remove());
      const outline = document.getElementById("outlineNav");
      outline.innerHTML = "";
      document.querySelectorAll("#article h2, #article h3").forEach((heading) => {
        const a = document.createElement("a");
        a.href = `#${heading.id}`;
        a.textContent = heading.textContent;
        a.dataset.target = heading.id;
        if (heading.tagName === "H2") {
          const side = a.cloneNode(true);
          sidebar.appendChild(side);
          a.className = "level-2";
        } else {
          a.className = "level-3";
        }
        outline.appendChild(a);
      });
    }

    function watchHeadings() {
      const sidebarLinks = [...document.querySelectorAll("#sidebarNav a")];
      const outlineLinks = [...document.querySelectorAll("#outlineNav a")];
      const headings = [...document.querySelectorAll("#article h2, #article h3")];
      const sync = () => {
        let current = headings[0];
        for (const heading of headings) {
          if (heading.getBoundingClientRect().top <= 96) current = heading;
        }
        if (!current) return;
        outlineLinks.forEach((link) => link.classList.toggle("active", link.dataset.target === current.id));
        let h2 = current;
        while (h2 && h2.tagName !== "H2") h2 = h2.previousElementSibling;
        sidebarLinks.forEach((link) => link.classList.toggle("active", link.dataset.target === h2?.id));
      };
      window.removeEventListener("scroll", window.__lumenGuideSpy);
      window.__lumenGuideSpy = sync;
      window.addEventListener("scroll", sync, { passive: true });
      sync();
    }

    async function loadGuide(lang) {
      currentLang = lang === "zh" ? "zh" : "en";
      localStorage.setItem("lumen_lang", currentLang);
      applyChrome();
      const file = currentLang === "zh" ? "guide.zh.md" : "guide.md";
      const article = document.getElementById("article");
      try {
        const res = await fetch(file, { cache: "no-cache" });
        if (!res.ok) throw new Error(`${res.status}`);
        article.innerHTML = renderMarkdown(await res.text());
      } catch (error) {
        article.innerHTML = `<p class="lede">Failed to load ${file}.</p>`;
      }
      buildNav();
      watchHeadings();
    }

    applyTheme(localStorage.getItem("lumen_user_theme") || "dark");
    loadGuide(currentLang);

    document.getElementById("langToggleBtn").addEventListener("click", () => {
      loadGuide(currentLang === "zh" ? "en" : "zh");
    });
    document.getElementById("themeToggleBtn").addEventListener("click", () => {
      applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
    });

    const menuBtn = document.getElementById("menuBtn");
    const backdrop = document.getElementById("backdrop");
    function closeNav() { document.documentElement.classList.remove("nav-open"); }
    menuBtn.addEventListener("click", () => document.documentElement.classList.toggle("nav-open"));
    backdrop.addEventListener("click", closeNav);
    document.getElementById("sidebarNav").addEventListener("click", closeNav);
  </script>
</body>
</html>
