<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Lumen</title>
  <meta name="description" content="Lumen — 本地开源模型对话与 Cowork 智能体桌面应用。" />
  <link rel="icon" type="image/png" href="icon.png" />

  <style>
    @font-face {
      font-family: "Lumen CJK";
      src: url("fonts/LXGWWenKaiLite-Light.ttf") format("truetype");
      unicode-range: U+3000-303F, U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF, U+FF00-FFEF;
      font-style: normal;
      font-weight: 300;
      font-display: swap;
    }

    @font-face {
      font-family: "Maple Mono";
      src: url("fonts/MapleMono-Light.ttf.woff2") format("woff2");
      font-style: normal;
      font-weight: 300;
      font-display: swap;
    }

    :root {
      color-scheme: dark light;
      --bg: #09090b;
      --fg: #f4f4f0;
      --fg-subtle: #9a9a92;
      --fg-faint: #52524c;
      --glass: rgba(18, 18, 22, 0.65);
      --glass-dropdown: rgba(18, 18, 22, 0.94);
      --glass-border: rgba(255, 255, 255, 0.1);
      --glass-border-hover: rgba(255, 255, 255, 0.28);
      --glass-hover: rgba(255, 255, 255, 0.08);
      --primary-bg: #f4f4f0;
      --primary-fg: #09090b;
      --accent-glow: rgba(245, 158, 11, 0.32);
      --accent-copper: #e59a68;
      --font-display: "Lumen CJK", "Maple Mono", sans-serif;
      --font-body: "Lumen CJK", "Maple Mono", sans-serif;
      --font-mono: "Maple Mono", monospace;
      --blur-strength: 28px;
    }

    [data-theme="light"] {
      color-scheme: light;
      --bg: #f7f6f2;
      --fg: #151513;
      --fg-subtle: #6b6a63;
      --fg-faint: #b2b1a8;
      --glass: rgba(255, 255, 255, 0.7);
      --glass-dropdown: rgba(255, 255, 255, 0.95);
      --glass-border: rgba(20, 20, 18, 0.1);
      --glass-border-hover: rgba(20, 20, 18, 0.28);
      --glass-hover: rgba(0, 0, 0, 0.05);
      --primary-bg: #151513;
      --primary-fg: #f7f6f2;
      --accent-glow: rgba(217, 119, 6, 0.22);
      --accent-copper: #b85d19;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      transition: background-color 0.35s ease, color 0.35s ease;
    }

    /* Ambient Living Light Canvas */
    #ambientLightCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
    }

    /* Tactile Micro-Grain Film Overlay */
    .film-grain {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Top Corner Controls (Guide, Language, Optical Theme) */
    .top-controls {
      position: fixed;
      top: 28px;
      right: 28px;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-circle-control {
      background: var(--glass);
      backdrop-filter: blur(var(--blur-strength));
      -webkit-backdrop-filter: blur(var(--blur-strength));
      border: 1px solid var(--glass-border);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      color: var(--fg);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
      text-decoration: none;
    }

    .btn-circle-control:hover {
      transform: scale(1.08);
      border-color: var(--glass-border-hover);
      background: var(--glass-dropdown);
    }

    /* Centered Stage Layout - Lifted slightly to optical golden ratio center */
    .stage {
      position: relative;
      z-index: 2;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 0 24px 6vh;
      text-align: center;
    }

    /* Brand Emblem with breathing radiant glow */
    .emblem-wrapper {
      position: relative;
      width: 96px;
      height: 96px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .emblem-glow {
      position: absolute;
      inset: -16px;
      background: radial-gradient(circle, var(--accent-glow) 0%, rgba(0,0,0,0) 70%);
      border-radius: 50%;
      filter: blur(14px);
      animation: pulseGlow 4.5s ease-in-out infinite alternate;
      pointer-events: none;
    }

    .emblem-core {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      box-shadow: none;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .emblem-core img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 6px 22px rgba(0, 0, 0, 0.4));
    }

    @keyframes pulseGlow {
      0% { transform: scale(0.92); opacity: 0.55; }
      100% { transform: scale(1.18); opacity: 1; }
    }

    /* Main Typography */
    .hero-title-wrap {
      margin-bottom: 12px;
    }

    .brand-wordmark {
      font-family: var(--font-display);
      font-size: clamp(38px, 5.8vw, 60px);
      font-weight: 500;
      letter-spacing: -2px;
      line-height: 1;
      color: var(--fg);
      text-shadow: 0 2px 24px rgba(0,0,0,0.18);
    }

    .brand-subtext {
      font-size: clamp(13px, 1.8vw, 17px);
      color: var(--fg-subtle);
      max-width: none;
      margin: 0 auto 36px;
      line-height: 1.5;
      font-weight: 400;
      letter-spacing: -0.15px;
      white-space: nowrap;
    }

    /* The Two Buttons Container */
    .buttons-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      width: 100%;
      max-width: 520px;
      position: relative;
    }

    /* Primary source button */
    .btn-download-primary {
      flex: 1.2;
      background: var(--primary-bg);
      color: var(--primary-fg);
      border: none;
      height: 50px;
      padding: 0 24px;
      border-radius: 14px;
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.22);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
      white-space: nowrap;
    }

    .btn-download-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.32);
      opacity: 0.95;
    }

    .btn-download-primary:active {
      transform: translateY(0);
    }

    /* Bottom Legal Links */
    .legal-links {
      position: fixed;
      left: 50%;
      bottom: 22px;
      z-index: 4;
      display: flex;
      gap: 20px;
      transform: translateX(-50%);
      font-size: 12.5px;
    }

    .legal-links a {
      color: var(--fg-subtle);
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .legal-links a:hover {
      color: var(--fg);
    }

    /* Responsive adjustments */
    @media (max-width: 620px) {
      .brand-wordmark { font-size: 36px; }
      .brand-subtext { font-size: 13px; }
      .buttons-row { flex-direction: column; gap: 12px; }
      .btn-download-primary { width: 100%; }
      .top-controls { top: 18px; right: 18px; }
      .legal-links { bottom: 14px; }
    }
  </style>
</head>
<body>

  <!-- Dynamic Ambient Canvas Background -->
  <canvas id="ambientLightCanvas"></canvas>
  <div class="film-grain"></div>

  <!-- Top Corner Controls: Usage Guide, Language, Optical Theme -->
  <div class="top-controls">
    <a href="guide.html" id="guideBtn" class="btn-circle-control" title="使用文档">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        <path d="M8 7h8M8 11h6"/>
      </svg>
    </a>
    <button id="langToggleBtn" class="btn-circle-control" onclick="toggleLanguage()" title="切换语言 / Switch Language (ZH / EN)">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="2" y1="12" x2="22" y2="12"></line>
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
      </svg>
    </button>
    <button id="themeToggleBtn" class="btn-circle-control" title="切换光影 / Toggle Light/Dark">
      <svg id="themeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
    </button>
  </div>

  <!-- Central Presentation Stage (Pure, Elegant & Centered) -->
  <main class="stage">
    <!-- Emblem (New Lumen Brand Icon) -->
    <div class="emblem-wrapper">
      <div class="emblem-glow"></div>
      <div class="emblem-core">
        <img src="icon.png" alt="Lumen" />
      </div>
    </div>

    <!-- Title (Lumen) -->
    <div class="hero-title-wrap">
      <h1 class="brand-wordmark">Lumen</h1>
    </div>

    <!-- Subtitle (Single Concise Line) -->
    <p class="brand-subtext" id="heroSubtitle">
      本地开源模型对话与 Cowork 智能体桌面应用。
    </p>

    <!-- Source -->
    <div class="buttons-row">
      <a href="https://github.com/5201200abc/lumen" id="primaryDownloadBtn" class="btn-download-primary" target="_blank" rel="noopener noreferrer">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 18l6-6-6-6"/>
          <path d="M8 6l-6 6 6 6"/>
          <path d="M14.5 4l-5 16"/>
        </svg>
        <span id="primaryBtnLabel">查看源代码</span>
      </a>
    </div>
  </main>

  <footer class="legal-links">
    <a href="privacy.html">Privacy</a>
    <a href="terms.html">Terms</a>
    <a href="https://github.com/5201200abc/lumen" target="_blank" rel="noopener noreferrer">GitHub</a>
  </footer>

  <!-- Dynamic Living Light Canvas Simulation Engine -->
  <script>
    (function initDynamicCausticEngine() {
      const canvas = document.getElementById('ambientLightCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let width, height;

      function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      const mouse = {
        x: width * 0.5,
        y: height * 0.4,
        targetX: width * 0.5,
        targetY: height * 0.4
      };

      window.addEventListener('mousemove', (e) => {
        mouse.targetX = e.clientX;
        mouse.targetY = e.clientY;
      });

      const beams = [
        {
          x: width * 0.28,
          y: height * 0.32,
          radius: 460,
          speedX: 0.18,
          speedY: 0.12,
          colorDark: 'rgba(234, 158, 98, 0.14)',
          colorLight: 'rgba(217, 119, 54, 0.16)'
        },
        {
          x: width * 0.72,
          y: height * 0.45,
          radius: 520,
          speedX: -0.15,
          speedY: 0.19,
          colorDark: 'rgba(129, 140, 248, 0.09)',
          colorLight: 'rgba(147, 130, 230, 0.13)'
        },
        {
          x: width * 0.5,
          y: height * 0.7,
          radius: 420,
          speedX: 0.12,
          speedY: -0.14,
          colorDark: 'rgba(245, 185, 95, 0.10)',
          colorLight: 'rgba(250, 200, 110, 0.15)'
        }
      ];

      let frame = 0;
      function animate() {
        frame += 0.005;

        mouse.x += (mouse.targetX - mouse.x) * 0.04;
        mouse.y += (mouse.targetY - mouse.y) * 0.04;

        ctx.clearRect(0, 0, width, height);
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';

        for (let i = 0; i < beams.length; i++) {
          const b = beams[i];
          b.x += b.speedX + Math.sin(frame + i * 1.5) * 0.45;
          b.y += b.speedY + Math.cos(frame * 0.8 + i) * 0.45;

          if (b.x < -150) b.x = width + 150;
          if (b.x > width + 150) b.x = -150;
          if (b.y < -150) b.y = height + 150;
          if (b.y > height + 150) b.y = -150;

          const gradient = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.radius);
          gradient.addColorStop(0, isDark ? b.colorDark : b.colorLight);
          gradient.addColorStop(1, 'rgba(0,0,0,0)');

          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
          ctx.fill();
        }

        const haloGrad = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 360);
        haloGrad.addColorStop(0, isDark ? 'rgba(240, 210, 180, 0.08)' : 'rgba(220, 160, 100, 0.12)');
        haloGrad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = haloGrad;
        ctx.beginPath();
        ctx.arc(mouse.x, mouse.y, 360, 0, Math.PI * 2);
        ctx.fill();

        requestAnimationFrame(animate);
      }
      animate();
    })();

    // Optical Theme Toggle
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    function applyTheme(mode) {
      document.documentElement.setAttribute('data-theme', mode);
      localStorage.setItem('lumen_user_theme', mode);
    }
    const currentTheme = localStorage.getItem('lumen_user_theme') || 'dark';
    applyTheme(currentTheme);

    themeToggleBtn.addEventListener('click', () => {
      const active = document.documentElement.getAttribute('data-theme');
      applyTheme(active === 'dark' ? 'light' : 'dark');
    });

    // Bilingual Translation Matrix (ZH / EN)
    const I18N = {
      zh: {
        guideTitle: '使用文档',
        subtitle: '本地开源模型对话与 Cowork 智能体桌面应用。',
        sourceCode: '查看源代码'
      },
      en: {
        guideTitle: 'Usage guide',
        subtitle: 'Local open-source model chat & Cowork agent desktop app.',
        sourceCode: 'View source'
      }
    };

    let currentLang = localStorage.getItem('lumen_lang') || 'zh';
    function applyLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('lumen_lang', lang);
      document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';

      const t = I18N[lang];
      const guideBtn = document.getElementById('guideBtn');
      if (guideBtn) guideBtn.title = t.guideTitle;
      document.getElementById('heroSubtitle').textContent = t.subtitle;
      document.getElementById('primaryBtnLabel').textContent = t.sourceCode;
    }

    function toggleLanguage() {
      applyLanguage(currentLang === 'zh' ? 'en' : 'zh');
    }

    applyLanguage(currentLang);

  </script>
</body>
</html>
